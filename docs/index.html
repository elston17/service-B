<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a service</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{
  /* Telegram supplies these. The fallbacks let you test in a normal browser. */
  --bg: var(--tg-theme-bg-color, #ffffff);
  --fg: var(--tg-theme-text-color, #10150f);
  --hint: var(--tg-theme-hint-color, #707c74);
  --card: var(--tg-theme-secondary-bg-color, #f2f5f0);
  --accent: var(--tg-theme-button-color, #17864a);
  --accent-fg: var(--tg-theme-button-text-color, #ffffff);
  --line: color-mix(in srgb, var(--hint) 28%, transparent);
  --ok: #17864a;
  --ok-bg: color-mix(in srgb, #17864a 12%, transparent);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding: 14px 16px calc(24px + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased;
}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--hint);font-size:13px;margin-bottom:16px}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--hint);margin:18px 0 8px}
.lab:first-of-type{margin-top:0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);
  font:600 13px/1 inherit;padding:10px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* stepper */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.stepper button{width:44px;height:42px;font:700 19px/1 inherit;background:var(--card);
  color:var(--fg);border:0;cursor:pointer}
.stepper button:disabled{opacity:.35}
.stepper span{min-width:84px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* inputs */
input{width:100%;font:15px inherit;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px}
input:focus{outline:none;border-color:var(--accent)}
.row{display:grid;grid-template-columns:62px 1fr;gap:7px}
.row .pre{display:grid;place-items:center;background:var(--card);border-radius:11px;
  font-weight:600;color:var(--hint)}
.hint{font-size:12px;color:var(--hint);margin-top:6px}
.err{font-size:12.5px;color:#c0392b;margin-top:6px}

/* summary + banners */
.sum{background:var(--ok-bg);border-radius:12px;padding:12px 13px;display:flex;
  justify-content:space-between;gap:12px;align-items:center;margin-bottom:4px}
.sum .t{font-weight:700;font-size:14px}
.sum .s{font-size:12px;color:var(--hint);margin-top:2px}
.sum .p{font-weight:800;font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum .was{display:block;font-size:12px;font-weight:600;text-decoration:line-through;opacity:.6;text-align:right}
.banner{background:var(--ok-bg);color:var(--ok);border-radius:11px;padding:10px 12px;
  font-size:12.5px;line-height:1.45;margin-top:12px}

/* days */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:11px;
  padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.day .dw{font-size:10px;color:var(--hint);font-weight:600}
.day .dd{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px}
.day.near{border-color:var(--ok)}
.day.near .dot{background:var(--ok)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.day[aria-pressed="true"] .dw,.day[aria-pressed="true"] .dd{color:var(--accent-fg)}
.day[aria-pressed="true"] .dot{background:var(--accent-fg)}
.day:disabled{opacity:.33;cursor:default}

/* slots */
.grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--hint);margin:14px 0 7px}
.slot{width:100%;border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:11px;padding:12px 13px;display:flex;align-items:center;gap:10px;
  margin-bottom:7px;cursor:pointer;text-align:left}
.slot .tm{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.slot .bd{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--card);
  color:var(--hint);white-space:nowrap}
.slot.near{border-color:var(--ok)}
.slot.near .bd{background:var(--ok);color:#fff}
.slot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.none{color:var(--hint);font-size:13px;padding:8px 0}

/* who's coming */
.tech{display:flex;align-items:center;gap:10px;background:var(--card);
  border-radius:12px;padding:11px 12px;margin-top:12px}
.tech .av{width:36px;height:36px;border-radius:50%;background:var(--accent);
  color:var(--accent-fg);display:grid;place-items:center;font-weight:700;flex:none}
.tech .n{font-weight:700;font-size:13.5px}
.tech .s{font-size:12px;color:var(--hint)}

/* consent */
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:0;
  border-radius:11px;padding:12px;margin-top:16px;width:100%;text-align:left;
  color:var(--fg);font:inherit;cursor:pointer}
.chk .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
  flex:none;display:grid;place-items:center;color:transparent;background:var(--bg);font-size:13px}
.chk[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk .t{font-size:13px;display:block}
.chk .s{font-size:11.5px;color:var(--hint);margin-top:2px;display:block}
.tech .n,.tech .s,.sum .t,.sum .s{display:block}

/* fallback button when opened outside Telegram */
#fallback{position:sticky;bottom:0;margin:20px -16px -24px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--bg);border-top:1px solid var(--line)}
#fallback button{width:100%;background:var(--accent);color:var(--accent-fg);border:0;
  border-radius:12px;padding:14px;font:700 15px inherit;cursor:pointer}
#fallback button:disabled{opacity:.45}
</style>
</head>
<body>
<div id="app"></div>
<div id="fallback" hidden><button id="fbBtn">Continue</button></div>

<script>
/* ===========================================================
   Telegram glue. If we're not inside Telegram (e.g. you opened
   this in Chrome to test), fall back to a normal button.
   =========================================================== */
var tg = window.Telegram && window.Telegram.WebApp;
var inTG = !!(tg && tg.initData !== undefined && tg.platform !== "unknown");
if (tg) { tg.ready(); tg.expand(); }
if (!inTG) document.getElementById("fallback").hidden = false;

function mainBtn(text, enabled, onTap) {
  if (inTG) {
    var b = tg.MainButton;
    b.setText(text);
    enabled ? b.enable() : b.disable();
    b.color = enabled ? (tg.themeParams.button_color || "#17864a") : "#9aa39b";
    b.show();
    b.offClick(mainBtn._h || function () {});
    mainBtn._h = function () { onTap(); };
    b.onClick(mainBtn._h);
  } else {
    var f = document.getElementById("fbBtn");
    f.textContent = text; f.disabled = !enabled; f.onclick = onTap;
  }
}
function backBtn(show, onTap) {
  if (!inTG) return;
  var b = tg.BackButton;
  b.offClick(backBtn._h || function () {});
  if (show) { backBtn._h = onTap; b.onClick(backBtn._h); b.show(); } else b.hide();
}
function tap() { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
function okBuzz() { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }

/* ===========================================================
   Booking logic — same rules as the demo
   =========================================================== */
var C = window.RW_CONFIG;
var DAYK = ["sun","mon","tue","wed","thu","fri","sat"];
var DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function sectorOf(pc) {
  if (!/^\d{6}$/.test(pc)) return null;
  var n = parseInt(pc.slice(0, 2), 10);
  return C.sectors.find(function (s) { return n >= s.lo && n <= s.hi; }) || null;
}
function centreOf(name) { return C.sectors.find(function (s) { return s.name === name; }); }
function kmBetween(a, b) {
  var A = centreOf(a), B = centreOf(b);
  if (!A || !B) return 999;
  return Math.hypot((A.lat - B.lat) * 111, (A.lng - B.lng) * 111);
}
function svc(id) { return C.services.find(function (s) { return s.id === id; }) || C.services[0]; }
function hhmm(m) {
  var h = Math.floor(m / 60), x = m % 60, ap = h < 12 ? "AM" : "PM", hh = h % 12 || 12;
  return hh + ":" + String(x).padStart(2, "0") + " " + ap;
}
/* Local YYYY-MM-DD. Never use toISOString() here: it shifts to UTC,
   which in Singapore turns midnight into the day before. */
function ymd(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}
/* The next N bookable days */
function upcoming() {
  var out = [], d = new Date(); d.setHours(0, 0, 0, 0);
  for (var i = 0; out.length < C.hours.daysAhead && i < 21; i++) {
    var x = new Date(d); x.setDate(d.getDate() + i);
    var k = DAYK[x.getDay()];
    if (C.hours.closedDays.indexOf(k) === -1) out.push({ date: x, key: k });
  }
  return out;
}
/* Who is working that day, and where */
function onDuty(dayKey) {
  return C.technicians.filter(function (t) { return t.areaByDay[dayKey]; });
}
/* The nearest on-duty technician within their own radius, else anyone free */
function assign(dayKey, area) {
  var free = onDuty(dayKey).map(function (t) {
    return { t: t, km: area ? kmBetween(area, t.areaByDay[dayKey]) : 999 };
  }).sort(function (a, b) { return a.km - b.km; });
  if (!free.length) return null;
  var near = free.find(function (x) { return x.km <= x.t.radiusKm; });
  if (near) return { tech: near.t, near: true, discount: near.t.discount, at: near.t.areaByDay[dayKey] };
  return { tech: free[0].t, near: false, discount: 0, at: free[0].t.areaByDay[dayKey] };
}

/* ===========================================================
   State
   =========================================================== */
var S = {
  step: 0,
  service: C.services[0].id,
  units: 3,
  postal: "",
  dayIdx: null,
  slot: null,
  name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user &&
         [tg.initDataUnsafe.user.first_name, tg.initDataUnsafe.user.last_name]
           .filter(Boolean).join(" ")) || "",
  phone: "",
  addr: "",
  optin: false,
  err: ""
};
var DAYS = upcoming();
var app = document.getElementById("app");
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) {
  return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); };

function priceNow() {
  var v = svc(S.service), u = v.perUnit ? S.units : 1;
  var base = v.price(u), a = sectorOf(S.postal);
  var d = 0;
  if (S.dayIdx !== null && S.slot !== null && a) {
    var q = assign(DAYS[S.dayIdx].key, a.name);
    if (q && q.near) d = q.discount;
  }
  return { base: base, disc: d, total: base - d, units: u, svc: v };
}

function summary() {
  var p = priceNow(), v = p.svc;
  var title = v.perUnit ? (p.units + " unit" + (p.units > 1 ? "s" : "") + " " + v.label.toLowerCase())
                        : v.label;
  return '<div class="sum"><div><div class="t">' + esc(title) + '</div>' +
    '<div class="s">' + esc(v.includes) + '</div></div>' +
    '<div class="p">' + (p.disc ? '<span class="was">S$' + p.base + "</span>" : "") +
    (v.from ? '<span style="font-size:11px">from </span>' : "") + "S$" + p.total + "</div></div>";
}

/* ===========================================================
   Screens
   =========================================================== */
function render() {
  [screen0, screen1, screen2, screen3][S.step]();
  window.scrollTo(0, 0);
}

/* 1 — what do you need */
function screen0() {
  var v = svc(S.service);
  app.innerHTML =
    "<h1>Book a service</h1><div class=\"sub\">" + esc(C.business.name) + "</div>" +
    summary() +
    '<div class="lab">What do you need?</div><div class="chips">' +
    C.services.map(function (s) {
      return '<button class="chip" data-sv="' + s.id + '" aria-pressed="' +
        (S.service === s.id) + '">' + esc(s.label) + "</button>";
    }).join("") + "</div>" +
    (v.perUnit
      ? '<div class="lab">How many units?</div><div class="stepper">' +
        '<button id="um" aria-label="Fewer">&minus;</button><span>' + S.units +
        " unit" + (S.units > 1 ? "s" : "") + '</span><button id="up" aria-label="More">+</button></div>'
      : "");

  app.querySelectorAll("[data-sv]").forEach(function (b) {
    b.onclick = function () { tap(); S.service = b.dataset.sv; render(); };
  });
  var um = document.getElementById("um"), up = document.getElementById("up");
  if (um) um.onclick = function () { tap(); S.units = Math.max(1, S.units - 1); render(); };
  if (up) up.onclick = function () { tap(); S.units = Math.min(12, S.units + 1); render(); };

  backBtn(false);
  mainBtn("Continue", true, function () { S.step = 1; render(); });
}

/* 2 — where are you */
function screen1() {
  var a = sectorOf(S.postal);
  app.innerHTML =
    "<h1>Where are you?</h1>" +
    '<div class="sub">So we can check who is working near you.</div>' +
    summary() +
    '<div class="lab">Postal code</div>' +
    '<input id="pc" inputmode="numeric" maxlength="6" placeholder="6 digits, e.g. 521234" value="' +
      esc(S.postal) + '">' +
    (a ? '<div class="hint" style="color:var(--ok);font-weight:600">' + esc(a.name) + "</div>"
       : S.postal ? '<div class="err">That is not a Singapore postal code.</div>'
                  : '<div class="hint">We only use this to find your area.</div>');

  var pc = document.getElementById("pc");
  pc.oninput = function () {
    S.postal = pc.value.replace(/\D/g, "").slice(0, 6);
    if (pc.value !== S.postal) pc.value = S.postal;
    var ok = !!sectorOf(S.postal);
    mainBtn("Continue", ok, function () { S.step = 2; S.dayIdx = null; S.slot = null; render(); });
    var h = app.querySelector(".hint,.err");
    if (h) {
      var s = sectorOf(S.postal);
      h.className = s ? "hint" : (S.postal ? "err" : "hint");
      h.style.color = s ? "var(--ok)" : "";
      h.style.fontWeight = s ? "600" : "";
      h.textContent = s ? s.name : (S.postal ? "That is not a Singapore postal code."
                                             : "We only use this to find your area.");
    }
  };

  backBtn(true, function () { S.step = 0; render(); });
  mainBtn("Continue", !!a, function () { S.step = 2; S.dayIdx = null; S.slot = null; render(); });
}

/* 3 — pick a time */
function screen2() {
  var a = sectorOf(S.postal);
  var nearDays = DAYS.map(function (d) {
    var q = assign(d.key, a && a.name);
    return !!(q && q.near);
  });
  var day = S.dayIdx !== null ? DAYS[S.dayIdx] : null;
  var q = day ? assign(day.key, a && a.name) : null;
  var slots = day ? C.hours.slots.slice() : [];
  var topDisc = Math.max.apply(null, C.technicians.map(function (t) { return t.discount; }));

  app.innerHTML =
    "<h1>Pick a time</h1><div class=\"sub\">" + esc(a ? a.name : "") + "</div>" +
    summary() +
    (nearDays.some(Boolean) && topDisc > 0
      ? '<div class="banner"><b>Green days are up to S$' + topDisc +
        " cheaper.</b> That is when we are already working near you, so you are not paying for our travel.</div>"
      : "") +
    '<div class="lab">Choose a day</div><div class="days">' +
    DAYS.map(function (d, i) {
      return '<button class="day' + (nearDays[i] ? " near" : "") + '" data-d="' + i +
        '" aria-pressed="' + (S.dayIdx === i) + '">' +
        '<span class="dw">' + DAYN[d.date.getDay()] + "</span>" +
        '<span class="dd">' + d.date.getDate() + "</span>" +
        '<span class="dot"></span></button>';
    }).join("") + "</div>" +
    (!day ? '<div class="none" style="margin-top:14px">Pick a day above.</div>'
      : ["Morning", "Afternoon"].map(function (g, gi) {
          var ts = slots.filter(function (t) { return gi === 0 ? t < 720 : t >= 720; });
          if (!ts.length) return "";
          return '<div class="grp">' + g + "</div>" + ts.map(function (t) {
            return '<button class="slot' + (q && q.near ? " near" : "") + '" data-t="' + t +
              '" aria-pressed="' + (S.slot === t) + '">' +
              '<span class="tm">' + hhmm(t) + "</span>" +
              '<span class="bd">' + (q && q.near
                ? (q.discount ? "Nearby &middot; S$" + q.discount + " off" : "Nearby")
                : "Available") + "</span></button>";
          }).join("");
        }).join("")) +
    (day && S.slot !== null && q
      ? '<div class="tech"><div class="av">' + esc(q.tech.initial) + "</div>" +
        '<div><div class="n">' + esc(q.tech.name) + " is coming</div>" +
        '<div class="s">' + esc(q.tech.bio) + (q.near ? " &middot; already in " + esc(q.at) : "") +
        "</div></div></div>"
      : "");

  app.querySelectorAll("[data-d]").forEach(function (b) {
    b.onclick = function () { tap(); S.dayIdx = +b.dataset.d; S.slot = null; render(); };
  });
  app.querySelectorAll("[data-t]").forEach(function (b) {
    b.onclick = function () { tap(); S.slot = +b.dataset.t; render(); };
  });

  backBtn(true, function () { S.step = 1; render(); });
  var p = priceNow();
  mainBtn(S.slot === null ? "Pick a time" : "Continue  ·  S$" + p.total,
    S.slot !== null, function () { S.step = 3; render(); });
}

/* 4 — your details */
function screen3() {
  var p = priceNow(), day = DAYS[S.dayIdx];
  var a = sectorOf(S.postal), q = assign(day.key, a && a.name);
  app.innerHTML =
    "<h1>Almost done</h1>" +
    '<div class="sub">' + DAYN[day.date.getDay()] + " " + day.date.getDate() + " " +
      day.date.toLocaleString("en-SG", { month: "short" }) + " &middot; " + hhmm(S.slot) +
      " &middot; " + esc(q.tech.name) + "</div>" +
    summary() +
    '<div class="lab">Your name</div><input id="nm" value="' + esc(S.name) + '" placeholder="Who should we ask for?">' +
    '<div class="lab">Mobile</div><div class="row"><div class="pre">+65</div>' +
    '<input id="ph" inputmode="numeric" maxlength="8" value="' + esc(S.phone) + '" placeholder="8 digits"></div>' +
    '<div class="hint">We send the confirmation and a reminder here.</div>' +
    '<div class="lab">Block and unit</div><input id="ad" value="' + esc(S.addr) +
      '" placeholder="e.g. Blk 244, #08-123">' +
    '<div class="hint">' + esc(a.name) + " &middot; " + esc(S.postal) + "</div>" +
    '<button class="chk" id="oi" aria-pressed="' + S.optin + '"><span class="bx">✓</span>' +
    '<span><span class="t">Tell me when you are in my area with a deal</span>' +
    '<span class="s">A few times a year at most. Reply STOP any time.</span></span></button>';

  var nm = document.getElementById("nm"), ph = document.getElementById("ph"), ad = document.getElementById("ad");
  function ok() { return S.name.trim().length > 1 && /^\d{8}$/.test(S.phone); }
  function refresh() {
    mainBtn("Confirm booking  ·  S$" + p.total, ok(), submit);
  }
  nm.oninput = function () { S.name = nm.value; refresh(); };
  ph.oninput = function () {
    S.phone = ph.value.replace(/\D/g, "").slice(0, 8);
    if (ph.value !== S.phone) ph.value = S.phone;
    refresh();
  };
  ad.oninput = function () { S.addr = ad.value; };
  document.getElementById("oi").onclick = function () {
    tap(); S.optin = !S.optin;
    this.setAttribute("aria-pressed", S.optin);
  };

  backBtn(true, function () { S.step = 2; render(); });
  refresh();
}

/* ===========================================================
   Send it back to the bot
   =========================================================== */
function submit() {
  var p = priceNow(), day = DAYS[S.dayIdx];
  var a = sectorOf(S.postal), q = assign(day.key, a.name);
  var payload = {
    v: 1,
    service: S.service,
    units: p.units,
    date: ymd(day.date),
    slot: S.slot,
    tech: q.tech.id,
    near: q.near,
    discount: p.disc,
    price: p.total,
    postal: S.postal,
    area: a.name,
    name: S.name.trim(),
    phone: S.phone,
    addr: S.addr.trim(),
    optin: S.optin
  };
  okBuzz();
  if (inTG) {
    tg.sendData(JSON.stringify(payload));   // Telegram closes the app for us
  } else {
    app.innerHTML = "<h1>Booking ready</h1><div class=\"sub\">Open this inside Telegram to send it.</div>" +
      "<pre style='white-space:pre-wrap;font-size:12px;background:var(--card);padding:12px;border-radius:11px'>" +
      esc(JSON.stringify(payload, null, 2)) + "</pre>";
    document.getElementById("fallback").hidden = true;
  }
}

render();
</script>
</body>
</html>
